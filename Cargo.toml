[package]
name = "xpersona"
version = "0.1.0"
edition = "2021"
description = "A sentence in, a realistic 3D body out: a HotMotor engine, no neural network"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# the field is sampled millions of times; tests would crawl unoptimised
[profile.dev]
opt-level = 2
